<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIRO Ready Prototype · v2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23101a20'/%3E%3Ctext x='12' y='17' font-family='Arial' font-size='14' font-weight='700' fill='%23fff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: same shell as the KAIRO (QPredict) prototype — top bar | icon rail that expands on hover | workspace | docked assistant. Calm neutrals biased toward the teal accent; state carried by pills and the stage stepper. */
:root{
  --bg:#f5f7f8; --panel:#ffffff; --panel-2:#f0f3f5; --hover:#eef2f4; --ink:#101a20; --muted:#5d6b75; --faint:#8a97a0; --line:#e1e6ea; --line-2:#d3dadf;
  --accent:#0d7a6b; --accent-soft:#e0f1ed;
  --approve:#b46a0c; --approve-soft:#fcefdc; --good:#1b8a4c; --good-soft:#e2f4e9; --warn:#a96f12; --warn-soft:#fbf0da; --bad:#c03d10; --bad-soft:#fde6dc;
  --sky:#2c6a99; --sky-soft:#e3edf6; --violet:#6d4bb0; --violet-soft:#eee8f8;
  --shadow:0 1px 2px rgba(16,26,32,.05),0 6px 20px rgba(16,26,32,.08);
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1216; --panel:#121a20; --panel-2:#172128; --hover:#1b262e; --ink:#e4ebef; --muted:#93a3ad; --faint:#6c7c86; --line:#222e36; --line-2:#2c3a43;
  --accent:#36bfa8; --accent-soft:#11302b;
  --approve:#f0a843; --approve-soft:#35270f; --good:#4cc982; --good-soft:#12301f; --warn:#e6b24f; --warn-soft:#33280f; --bad:#f0845c; --bad-soft:#381b11;
  --sky:#80b6df; --sky-soft:#142838; --violet:#b39af0; --violet-soft:#261e3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1216; --panel:#121a20; --panel-2:#172128; --hover:#1b262e; --ink:#e4ebef; --muted:#93a3ad; --faint:#6c7c86; --line:#222e36; --line-2:#2c3a43;
  --accent:#36bfa8; --accent-soft:#11302b;
  --approve:#f0a843; --approve-soft:#35270f; --good:#4cc982; --good-soft:#12301f; --warn:#e6b24f; --warn-soft:#33280f; --bad:#f0845c; --bad-soft:#381b11;
  --sky:#80b6df; --sky-soft:#142838; --violet:#b39af0; --violet-soft:#261e3a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body,#root{height:100%}
body{overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);height:100%;padding-left:env(safe-area-inset-left,0px)}
/* top */
.top{grid-column:1/3;display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs .sep{color:var(--line-2)}
.crumbs button{all:unset;cursor:pointer}
.crumbs button:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.search{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--faint);width:260px}
.search input{all:unset;flex:1;color:var(--ink);min-width:0}
.ib{all:unset;cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ib:focus-visible{outline:2px solid var(--accent)}
.ib .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}
.av{width:28px;height:28px;border-radius:50%;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:650;flex:none}
.bellpop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:48px;width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:60}
.bellpop h5{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.bellpop button{all:unset;cursor:pointer;display:block;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;width:100%;box-sizing:border-box}
.bellpop button:last-child{border-bottom:0}
.bellpop button:hover{background:var(--hover)}
.bellpop small{display:block;color:var(--faint);font-size:12px}
/* rail */
.rail{grid-row:2;grid-column:1;position:relative;z-index:25}
.rl{position:absolute;inset:0 auto 0 0;width:56px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:10px 8px;overflow:hidden;transition:width .15s ease}
.rail:hover .rl,.rail:focus-within .rl{width:232px;box-shadow:var(--shadow)}
.ri{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:7px;color:var(--muted);white-space:nowrap;font-weight:500}
.ri:hover{background:var(--hover);color:var(--ink)}
.ri.on{background:var(--accent-soft);color:var(--accent)}
.ri:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ri span{opacity:0;transition:opacity .12s}
.rail:hover .ri span,.rail:focus-within .ri span,.rail:hover .rh,.rail:focus-within .rh{opacity:1}
.ri em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint);opacity:0}
.rail:hover .ri em,.rail:focus-within .ri em{opacity:1}
.rh{margin:12px 11px 4px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);opacity:0;white-space:nowrap;height:14px}
.rsep{height:1px;background:var(--line);margin:8px 4px}
.mod{display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
.mod .ri.on{background:var(--ink);color:var(--bg)}
/* main */
.main{grid-row:2;grid-column:2;overflow:auto;min-width:0}
.wrap{max-width:1120px;margin:0 auto;padding-block:24px 140px;padding-left:max(16px,env(safe-area-inset-right,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.ph .tt{flex:1;min-width:240px}
.ph h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-wrap:balance}
.ph p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:78ch}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted);background:var(--panel);white-space:nowrap}
.chip b{color:var(--ink);font-weight:550}
.chip.real{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.ex{border-style:dashed}
/* buttons */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:6px;font-weight:500;font-size:13px;background:var(--ink);color:var(--bg);white-space:nowrap;box-sizing:border-box}
.btn:hover{opacity:.87}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line-2)}
.btn.sec:hover{background:var(--hover);opacity:1}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink);opacity:1}
.btn.ap{background:var(--approve);color:#fff}
.btn.dn{background:transparent;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{all:unset;cursor:pointer;color:var(--accent);font-weight:550}
.lnk:hover{text-decoration:underline}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;white-space:nowrap;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 24%,transparent);color:var(--muted)}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.nd::before{display:none}
.pill.g{color:var(--good);background:var(--good-soft)} .pill.w{color:var(--warn);background:var(--warn-soft)} .pill.b{color:var(--bad);background:var(--bad-soft)}
.pill.a{color:var(--approve);background:var(--approve-soft)} .pill.s{color:var(--sky);background:var(--sky-soft)} .pill.v{color:var(--violet);background:var(--violet-soft)}
.pill.l1{color:var(--accent);background:var(--accent-soft)} .pill.l2{color:var(--approve);background:var(--approve-soft)} .pill.l3{color:var(--bad);background:var(--bad-soft)}
/* cards, kpis */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.ch{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ch h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.cb{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--kc,transparent)}
.kpi span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.kpi b{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;align-items:start}
.g21{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
/* segmented */
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:3px 10px;border-radius:5px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:550}
.seg button:focus-visible{outline:2px solid var(--accent)}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--hover)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.sub{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.mut{color:var(--muted)}
.bars{display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px}
.bars i{width:14px;height:5px;border-radius:3px;background:var(--line-2)}
.bars i.d{background:var(--good)} .bars i.c{background:var(--ink)}
/* stepper */
.stp-row{display:flex;align-items:center;gap:0;overflow-x:auto;scrollbar-width:none;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.stp-row::-webkit-scrollbar{display:none}
.sbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.sbar .tx{flex:1 1 300px;min-width:0;font-size:13px;color:var(--muted)}
.sbar .tx b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.sbar .acts{display:flex;gap:8px;flex-wrap:wrap}
.sbar.cur{border-color:var(--ink);box-shadow:0 0 0 3px var(--hover)}
.rule{display:flex;gap:10px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line);font-size:13px}
.rule:last-child{border-bottom:0}
.rule .si{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.rule .si svg{width:10px;height:10px;stroke-width:3}
.rule.done .si{background:var(--good);border-color:var(--good);color:#fff}
.rule.run .si{border-color:var(--ink);border-top-color:transparent;animation:spin .8s linear infinite}
.rule.hit .si{background:var(--warn);border-color:var(--warn);color:#fff}
.rule .r{margin-left:auto;color:var(--muted);font-size:12px}
.rule.wait{color:var(--faint)}
.stp{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;flex:none;font-size:13px;color:var(--faint);white-space:nowrap;border-radius:6px;padding:2px}
.stp .d{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--panel)}
.stp .d svg{width:12px;height:12px;stroke-width:2.6}
.stp.done{color:var(--muted)} .stp.done .d{background:var(--good);border-color:var(--good);color:#fff}
.stp.cur{color:var(--ink)} .stp.cur .d{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.stp.view .l{font-weight:650;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
.stp.lock{cursor:default}
.stp .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}
.stp:focus-visible{box-shadow:0 0 0 3px var(--accent-soft)}
.sl{flex:1 1 24px;min-width:18px;height:1.5px;background:var(--line-2);margin:0 10px}
.sl.done{background:var(--good)}
/* tabs */
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:8px 0 10px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabs button em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:4px}
.tabs button:focus-visible{outline:2px solid var(--accent)}
/* findings, changes */
.grp{padding:8px 16px;background:var(--panel-2);border-bottom:1px solid var(--line);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.fd{padding:14px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.fd:last-child{border-bottom:0}
.fd h4{margin:0;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fd p{margin:0;font-size:13px;color:var(--muted)}
.fd .q{font-size:13px;border-left:2px solid var(--bad);padding-left:9px;color:var(--ink)}
.fd .q small{display:block;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.fd .act{grid-column:2;grid-row:1/4;align-self:start;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.cl{display:flex;flex-direction:column}
.ci{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.ci:last-child{border-bottom:0}
.ci:hover{background:var(--hover)}
.ci.on{background:var(--accent-soft)}
.ci .id{font-family:var(--mono);font-size:12px;color:var(--faint);grid-row:1/3;padding-top:1px}
.ci b{font-weight:550;font-size:13.5px}
.ci .pp{display:flex;gap:4px;flex-wrap:wrap}
.ci:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
.meta div span{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.diff{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-bottom:1px solid var(--line)}
.diff>div{padding:12px 16px;min-width:0}
.diff>div+div{border-left:1px solid var(--line)}
.diff h5{margin:0 0 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--faint)}
.diff .bef{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.diff .aft{color:var(--ink)}
.big{font-size:22px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
pre.code{margin:0;font-family:var(--mono);font-size:12px;line-height:1.55;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre}
pre.code .add{color:var(--good)}
textarea{width:100%;min-height:84px;border:1px solid var(--line-2);border-radius:6px;padding:8px 10px;background:var(--panel);resize:vertical;font-size:13px}
textarea:focus,select:focus,input:focus{outline:2px solid var(--accent);outline-offset:0}
select,input[type=text]{border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;background:var(--panel);font-size:13px}
.why{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px}
.why svg{color:var(--violet);margin-top:2px}
.foot{display:flex;gap:8px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.foot .mut{font-size:12px}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:8px;font-size:13px;background:var(--panel);border:1px solid var(--line)}
.note.s{background:var(--sky-soft);border-color:color-mix(in srgb,var(--sky) 30%,transparent)}
.note.a{background:var(--approve-soft);border-color:color-mix(in srgb,var(--approve) 35%,transparent)}
.note.g{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.note.b{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.note svg{margin-top:2px}
.note{flex-wrap:wrap}
.note .grow{flex:1 1 240px;min-width:0}
.note .btn{max-width:100%;white-space:normal;height:auto;min-height:30px;padding-block:5px}
/* score ring */
.score{display:flex;gap:18px;align-items:center;padding:16px}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:650;letter-spacing:-.02em}
.cats{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.cat{display:grid;grid-template-columns:96px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:12.5px}

          rows: C.length + P.length

        uses: ["rule:R1", "rule:R2", "col:TXN_HIST.cncl", "rule:R5", "rule:R7", "rel:L3"]

  }

  /* ---------- Q2: best region last quarter ---------- */
  function q2() {
    const C = months(202607, 202609), P = months(202604, 202606);
    const reg = RG.map(k => {
      const c = sum(C.filter(r => region(r) === k), net), p = sum(P.filter(r => region(r) === k), net), t = target([7, 8, 9], k);
      return { k, name: D.REGIONS[k], c, p, g: (c - p) / p, t, att: c / t };
    });
    const total = sum(reg, r => r.c), totalP = sum(reg, r => r.p);
    const best = [...reg].sort((a, b) => b.c - a.c)[0], fast = [...reg].sort((a, b) => b.g - a.g)[0], weak = [...reg].sort((a, b) => a.att - b.att)[0];
    const onT = reg.filter(r => r.att >= 1).length;

    const from = dateAdd(AS_OF, -89);

    return {
      std: {
        text: `Grouping Sale by rgn_cd for the last 90 days, the highest total is rgn_cd ${raw[0].k} (${money(raw[0].v)}), followed by ${raw[1].k} (${money(raw[1].v)}), ${raw[2].k} (${money(raw[2].v)}) and ${raw[3].k} (${money(raw[3].v)}).`,
        verdict: { kind: "partial", label: "Incomplete", why: "Regions are shown only as codes, “last 90 days” is not last quarter, and the amounts are gross." }
      },

          ["Find data", "TXN_HIST → CUST_MSTR for region · TGT_PLAN for targets"],
          ["Apply rules", "Net sales rule; attainment = net sales ÷ target"],
          ["Calculate & check", `${(C.length + P.length).toLocaleString()} order lines across Q2 and Q3`]
        ],
        headline: `<b>${best.name}</b> sold the most in Q3 2026: <b>${money(best.c)}</b> in net sales, ${pct(best.att, 0)} of its target.`,
        kpis: [
          { label: "Net sales · Q3", value: short(total), sub: spct((total - totalP) / totalP) + " vs Q2", tone: total >= totalP ? "up" : "down" },
          { label: "Best region", value: best.name, sub: short(best.c) },
          { label: "Fastest growth", value: fast.name, sub: spct(fast.g) + " vs Q2", tone: "up" },
          { label: "On target", value: onT + " of 4", sub: "regions at 100%+", tone: onT >= 3 ? "up" : "down" }

          rows: [...reg].sort((a, b) => b.c - a.c).map(r => [r.name, money(r.c), spct(r.g), money(r.t), { v: pct(r.att, 0), tone: r.att >= 1 ? "up" : "down" }])
        },
        findings: [
          `${best.name} brought in ${pct(best.c / total, 0)} of all Q3 net sales.`,

          `${weak.name} is furthest from target at ${pct(weak.att, 0)} (${money(weak.c)} of ${money(weak.t)}).`
        ],
        recs: [
          weak.att < 1 ? `Review ${weak.name}'s pipeline: it needs ${money(weak.t - weak.c)} more to match a full quarter on target.` : `All regions are at or above target. Consider raising ${best.name}'s Q4 target.`,
          `Share what worked in ${fast.name} with the other regions.`
        ],
        how: {
          data: "TXN_HIST · CUST_MSTR · TGT_PLAN",
          calc: `SUM(Sale − disc) WHERE cncl = 0 AND ret_flg = 'N'\n  AND dt BETWEEN 20260401 AND 20260930\nGROUP BY quarter, rgn_cd → region name`,
          rows: C.length + P.length
        },
        uses: ["rule:R1", "rule:R3", "rule:R5", "rule:R7", "col:TXN_HIST.cncl", "rel:L1", "rel:L3"]

  }

  /* ---------- Q3: top 5 customers this year ---------- */
  function q3() {
    const Y = range(20260101, AS_OF);
    const per = {};
    Y.forEach(r => { per[r.cid] = (per[r.cid] || 0) + net(r); });
    const total = sum(Y, net);
    const last = {};
    TX.forEach(r => { if (done(r) && (!last[r.cid] || r.dt > last[r.cid])) last[r.cid] = r.dt; });
    const top = Object.entries(per).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([cid, v]) => {
      const c = cust[cid], days = daysBetween(last[cid], AS_OF);
      return { cid, name: c.c_nm, seg: D.SEGS[c.seg], region: D.REGIONS[c.rgn_cd], v, share: v / total, last: last[cid], days, risk: days > 45 };
    });
    const t5 = sum(top, x => x.v), risky = top.filter(x => x.risk);

    const gross = {};
    Y.forEach(r => { gross[r.cid] = (gross[r.cid] || 0) + r.Sale; });
    const gTop = Object.entries(gross).sort((a, b) => b[1] - a[1]).slice(0, 5);
    return {
      std: {
        text: `Top 5 cid by total Sale in 2026: ${gTop.map(([c, v]) => `${c} (${money(v)})`).join(", ")}.`,
        verdict: { kind: "partial", label: "Incomplete", why: "It shows customer IDs instead of names, and the amounts include cancelled and returned orders." }
      },
      desk: {
        steps: [
          ["Understand", "“customers” → CUST_MSTR.c_nm · “this year” → 1 Jan – " + dateTxt(AS_OF)],
          ["Find data", "TXN_HIST linked to CUST_MSTR by cid"],
          ["Apply rules", "Net sales rule; flag customers with no order for 45+ days"],
          ["Calculate & check", `${Y.length.toLocaleString()} order lines · ${Object.keys(per).length} customers`]

          { label: "Share of total", value: pct(t5 / total, 0), sub: "of " + short(total) },
          { label: "Biggest customer", value: top[0].name, sub: short(top[0].v), small: true },
          { label: "At risk", value: String(risky.length), sub: "no order 45+ days", tone: risky.length ? "down" : "up" }
        ],
        table: {
          cols: ["Customer", "Segment", "Region", "Net sales 2026", "Last order"],
          rows: top.map(x => [x.name, x.seg, x.region, money(x.v), { v: dateTxt(x.last) + (x.risk ? ` · ${x.days} days ago` : ""), tone: x.risk ? "down" : "" }])
        },
        findings: [
          `${top[0].name} is the biggest customer with ${money(top[0].v)} (${pct(top[0].share)} of net sales).`,
          (n => n === 5 ? "All 5 are Enterprise customers." : `${n} of the top 5 are Enterprise customers.`)(top.filter(x => x.seg === "Enterprise").length),
          risky.length ? `${risky.map(x => x.name).join(" and ")} ${risky.length > 1 ? "have" : "has"} not ordered for more than 45 days.` : "All top 5 customers have ordered in the last 45 days."
        ],
        recs: risky.length
          ? risky.map(x => `Call ${x.name}: no order for ${x.days} days, after ${money(x.v)} this year.`)
          : [`Keep the top 5 close: they are ${pct(t5 / total, 0)} of net sales. Plan account reviews for Q4.`],
        how: {
          data: "TXN_HIST · CUST_MSTR",
          calc: `SUM(Sale − disc) WHERE cncl = 0 AND ret_flg = 'N'\n  AND dt BETWEEN 20260101 AND ${AS_OF}\nGROUP BY cid → c_nm  ORDER BY 1 DESC  LIMIT 5`,
          rows: Y.length
        },
        uses: ["rule:R1", "col:TXN_HIST.cncl", "rel:L1"]
      }
    };

  /* ---------- Q4: active customers ---------- */
  function q4() {
    const aFrom = dateAdd(AS_OF, -89), bTo = dateAdd(aFrom, -1), bFrom = dateAdd(bTo, -89);
    const set = (a, b) => new Set(range(a, b).filter(done).map(r => r.cid));
    const A = set(aFrom, AS_OF), B = set(bFrom, bTo);
    const first = {};
    TX.forEach(r => { if (done(r) && (!first[r.cid] || r.dt < first[r.cid])) first[r.cid] = r.dt; });
    const newC = [...A].filter(c => first[c] >= aFrom);
    const lostNet = {};
    range(bFrom, bTo).forEach(r => { if (!A.has(r.cid)) lostNet[r.cid] = (lostNet[r.cid] || 0) + net(r); });
    const lost = Object.entries(lostNet).sort((a, b) => b[1] - a[1]);
    const flag = T.CUST_MSTR.filter(c => c.sts === "A").length;
    const ch = A.size - B.size;
    return {
      std: {
        text: `There are ${flag} active customers in CUST_MSTR (sts = 'A').`,
        verdict: { kind: "wrong", label: "Wrong", why: `The sts flag is set by hand and not kept up to date. Only ${A.size} customers actually ordered in the last 90 days.` }
      },
      desk: {
        steps: [
          ["Understand", "“active customer” → completed order in the last 90 days (rule R4)"],
          ["Find data", "TXN_HIST order dates, CUST_MSTR for names; sts flag ignored"],
          ["Apply rules", `Window ${dateTxt(aFrom)} – ${dateTxt(AS_OF)}; leave out cancelled and returned lines`],
          ["Calculate & check", `Compared with the 90 days before (${dateTxt(bFrom)} – ${dateTxt(bTo)})`]

          { label: "Active now", value: String(A.size), sub: `vs ${B.size} before`, tone: ch >= 0 ? "up" : "down" },
          { label: "New", value: String(newC.length), sub: "first-time buyers", tone: "up" },
          { label: "Stopped ordering", value: String(lost.length), sub: "lapsed customers", tone: lost.length ? "down" : "" },
          { label: "CRM flag says", value: String(flag), sub: "sts = 'A' · stale", tone: "muted" }
        ],
        table: lost.length ? {

          rows: lost.slice(0, 4).map(([cid, v]) => [cust[cid].c_nm, D.SEGS[cust[cid].seg], money(v)])
        } : null,
        findings: [
          `${newC.length} customer${newC.length === 1 ? "" : "s"} placed their first order in the last 90 days.`,

          "Update the CRM status flag from order history so other reports stop over-counting."
        ],
        how: {
          data: "TXN_HIST · CUST_MSTR",
          calc: `COUNT(DISTINCT cid) WHERE cncl = 0 AND ret_flg = 'N'\n  AND dt BETWEEN ${aFrom} AND ${AS_OF}`,
          rows: range(bFrom, AS_OF).length
        },

  /* ---------- Q5: return rate by category ---------- */
  function q5() {
    const A = months(202604, 202609), B = months(202510, 202603);
    const cats = Object.keys(D.CATS).map(c => {
      const a = A.filter(r => prod[r.pid].cat_cd === c), b = B.filter(r => prod[r.pid].cat_cd === c);
      return { c, name: D.CATS[c], a: returnRate(a), b: returnRate(b), val: sum(a.filter(r => r.cncl === 0 && r.ret_flg === "Y"), r => r.Sale) };
    }).sort((x, y) => y.a - x.a);
    const top = cats[0], rise = [...cats].sort((x, y) => (y.a - y.b) - (x.a - x.b))[0];
    const all = returnRate(A), allB = returnRate(B);
    const prodRet = {};
    A.filter(r => r.cncl === 0 && r.ret_flg === "Y" && prod[r.pid].cat_cd === rise.c).forEach(r => { prodRet[r.pid] = (prodRet[r.pid] || 0) + r.Sale; });
    const worst = Object.entries(prodRet).sort((a, b) => b[1] - a[1])[0];
    return {
      std: {
        text: "I couldn't find any information about returns in the available data. You could try asking about Sale or qty instead.",
        verdict: { kind: "none", label: "No answer", why: "Returns are stored in ret_flg, which has no description, so the assistant can't connect “returns” to it." }
      },
      desk: {
        steps: [
          ["Understand", "“returns” → ret_flg = Y · “category” → PRD_REF.cat_cd"],
          ["Find data", "TXN_HIST linked to PRD_REF by pid"],
          ["Apply rules", "Return rate = returned value ÷ gross sales, leaving out cancelled lines"],
          ["Calculate & check", "Last 6 full months (Apr–Sep 2026) against the 6 before"]
        ],
        headline: `<b>${top.name}</b> has the highest return rate: <b>${pct(top.a)}</b> of gross sales over the last 6 months (Apr–Sep 2026).`,
        kpis: [
          { label: "Overall return rate", value: pct(all), sub: `was ${pct(allB)} before`, tone: all > allB ? "down" : "up" },
          { label: "Highest", value: top.name, sub: pct(top.a) },
          { label: "Biggest rise", value: rise.name, sub: `${pct(rise.b)} → ${pct(rise.a)}`, tone: "down" },
          { label: "Returned value", value: short(sum(cats, x => x.val)), sub: "Apr–Sep 2026" }
        ],
        chart: { title: "Return rate by category, Apr–Sep 2026", horizontal: true, items: cats.map(x => ({ label: x.name, value: x.a, hi: x.c === top.c })), fmt: v => pct(v) },
        findings: [
          `Overall, ${pct(all)} of gross sales came back, ${all > allB ? "up" : "down"} from ${pct(allB)} in the six months before.`,
          `${rise.name} rose the most: from ${pct(rise.b)} to ${pct(rise.a)}.`,
          worst ? `In ${rise.name}, ${prod[worst[0]].p_desc} had the most returned value: ${money(worst[1])}.` : `${rise.name} returns are spread across products.`
        ],
        recs: [
          worst ? `Ask the product team to look at ${prod[worst[0]].p_desc} returns: check the return reasons and the batch or supplier.` : `Review ${rise.name} return reasons.`,
          `Track the ${top.name} return rate monthly and set an alert above ${pct(Math.ceil(top.a * 100) / 100, 0)}.`
        ],
        how: {
          data: "TXN_HIST · PRD_REF",
          calc: `SUM(Sale WHERE ret_flg = 'Y') / SUM(Sale)\n  WHERE cncl = 0 AND dt BETWEEN 20260401 AND 20260930\nGROUP BY cat_cd → category name`,
          rows: A.length + B.length
        },
        uses: ["rule:R6", "col:TXN_HIST.ret_flg", "col:TXN_HIST.cncl", "rel:L2"]
      }
    };
  }

  /* ---------- Q6: on track for this quarter's target ---------- */
  function q6() {
    const days = AS_OF % 100, X = range(20261001, AS_OF), nX = sum(X, net);
    const tOct = target([10]), tQ = target([10, 11, 12]), pr = tOct * days / 31, pace = nX / pr, projOct = nX / days * 31;
    const qProj = (projOct + target([11, 12])) / tQ;
    const reg = RG.map(k => { const v = sum(X.filter(r => region(r) === k), net), p = target([10], k) * days / 31; return { name: D.REGIONS[k], v, p, pace: v / p }; }).sort((a, b) => b.pace - a.pace);
    const behind = reg.filter(r => r.pace < 1);
    return {
      std: {
        text: "I found a table TGT_PLAN with a column tgt_amt, but I couldn't work out how it relates to Sale, so I can't tell whether you are on track.",
        verdict: { kind: "none", label: "No answer", why: "TGT_PLAN has no field in common with TXN_HIST, so the assistant can't link targets to sales." }
      },
      desk: {
        steps: [
          ["Understand", "“this quarter” → Q4 2026 · “target” → TGT_PLAN.tgt_amt"],
          ["Find data", "TGT_PLAN joined to sales by month and region (relationship L3)"],
          ["Apply rules", `Net sales rule; target pro-rated for ${days} of 31 days in October`],
          ["Calculate & check", `${X.length} order lines in October so far`]
        ],
        headline: `Yes, so far. October is at <b>${pct(pace, 0)} of target pace</b>: ${money(nX)} in net sales after ${days} days, against a pro-rated target of ${money(pr)}.`,
        kpis: [
          { label: "Oct so far", value: short(nX), sub: `1–${days} Oct` },
          { label: "Pace vs target", value: pct(pace, 0), sub: "of pro-rated target", tone: pace >= 1 ? "up" : "down" },
          { label: "October forecast", value: short(projOct), sub: "target " + short(tOct), tone: projOct >= tOct ? "up" : "down" },
          { label: "Q4 forecast", value: pct(qProj, 0), sub: "of " + short(tQ) + " target", tone: qProj >= 1 ? "up" : "down" }
        ],
        chart: { title: "October pace vs target, by region", horizontal: true, items: reg.map(r => ({ label: r.name, value: r.pace, hi: r.pace < 1 })), fmt: v => pct(v, 0) },
        findings: [
          `At the current pace, October closes at about ${money(projOct)}, ${pct(Math.abs(projOct / tOct - 1), 0)} ${projOct >= tOct ? "above" : "below"} its ${money(tOct)} target.`,
          behind.length ? `${behind.map(r => r.name).join(" and ")} ${behind.length > 1 ? "are" : "is"} behind pace (${behind.map(r => pct(r.pace, 0)).join(", ")}).` : "Every region is on or ahead of pace.",
          `November and December carry ${pct(target([11, 12]) / tQ, 0)} of the Q4 target, so the quarter is not won yet.`
        ],
        recs: [
          behind.length ? `Focus the next ${31 - days} days on ${behind[behind.length - 1].name}: it needs ${money(target([10], RG.find(k => D.REGIONS[k] === behind[behind.length - 1].name)) - behind[behind.length - 1].v)} more to reach its October target.` : `Lock in the lead: move November deals forward where customers are ready.`,
          "Re-check this forecast weekly; it assumes the current daily pace holds."
        ],
        how: {
          data: "TXN_HIST · CUST_MSTR · TGT_PLAN",
          calc: `SUM(Sale − disc) WHERE cncl = 0 AND ret_flg = 'N'\n  AND dt BETWEEN 20261001 AND ${AS_OF}\n÷ (SUM(tgt_amt WHERE yr = 2026 AND mo = 10) × ${days}/31)`,
          rows: X.length
        },
        uses: ["rule:R1", "rule:R7", "col:TXN_HIST.cncl", "rel:L3"]
      }
    };
  }

  function fallback() {
    return {
      std: {
        text: "I can see the tables CUST_MSTR, TXN_HIST, PRD_REF and TGT_PLAN. Could you rephrase your question using the column names?",
        verdict: { kind: "none", label: "No answer", why: "The assistant only sees technical names, so it asks the user to know the database." }
      },
      desk: {
        steps: [["Understand", "No approved business term matched this question"], ["Find data", "Not needed yet"], ["Apply rules", "—"], ["Calculate & check", "—"]],
        headline: "I can answer questions about <b>sales, regions, customers, returns and targets</b> from your connected data. Try one of the suggested questions, or ask, for example, “Which region performed best last quarter?”",
        kpis: [], findings: [], recs: [], fallback: true, uses: []
      }
    };
  }

  const QUESTIONS = [
    { q: "What were our sales last month, and how did they compare with the previous month?", fn: q1 },
    { q: "Which region performed best last quarter?", fn: q2 },
    { q: "Who are our top 5 customers this year?", fn: q3 },
    { q: "How many active customers do we have?", fn: q4 },
    { q: "What is our return rate by product category?", fn: q5 },
    { q: "Are we on track to hit this quarter's target?", fn: q6 }
  ];
  const cache = {};
  function route(text) {
    const t = text.toLowerCase();
    // Only route when the question clearly matches one prepared answer; anything else gets an honest fallback.
    if (/return/.test(t) && !/channel|segment|city|country|customer/.test(t)) return 4;
    if (/margin|profit|channel|churn|forecast next|by product|by segment|per segment|by city|by country/.test(t)) return -1;
    if (/target|quota|\bplan\b|on track|pace|budget/.test(t)) return 5;
    if (/active customer|active client|customers are active|how many customers|customer count/.test(t)) return 3;
    if (/(top|best|biggest|largest)/.test(t) && /customer|client|account/.test(t)) return 2;
    if (/region|territor/.test(t)) return 1;
    if (/sale|revenue|sold|turnover/.test(t) && /month|compare|previous|trend/.test(t)) return 0;
    return -1;
  }
  function answer(text) {
    const i = route(text);
    if (i < 0) return Object.assign({ q: text, idx: -1 }, fallback());
    if (!cache[i]) cache[i] = QUESTIONS[i].fn();
    return Object.assign({ q: text, idx: i }, cache[i]);
  }

  return { QUESTIONS, answer, money, short, pct, mName, dateTxt, months, net, sum, AS_OF, cust, prod };
})();

function runApply(a){
 const list=a.changes.filter(c=>c.st==='approved');
 a.running=true; a.run={}; let qi=0;
 const next=()=>{
  if(qi>=list.length){a.running=false;a.ran=true;S.follow=null;render(true);const m=document.getElementById('main');if(m)m.scrollTop=0;return;}
  const c=list[qi]; const steps=STEPS(c); const proveIdx=steps.findIndex(s=>s.startsWith('Prove'));
  if(c.dep&&a.changes.find(x=>x.id===c.dep).st==='stopped'){c.st='skipped';qi++;render(true);setTimeout(next,250);return;}
  c.st='running'; let i=0; a.run[c.id]={i:0,state:'run'};
  const tick=()=>{
   const fail=S.scenario==='fail'&&c.id==='014'&&i===proveIdx;
   if(fail){a.run[c.id]={i,state:'fail'};c.st='stopped';qi++;render(true);setTimeout(next,500);return;}
   i++; if(i>=steps.length){a.run[c.id]={i:steps.length,state:'done'};c.st='proved';qi++;render(true);setTimeout(next,300);return;}
   a.run[c.id]={i,state:'run'};S.follow=c.id;render(true);setTimeout(tick,i===proveIdx?420:190);
  };
  S.follow=c.id;render(true);setTimeout(tick,190);
 };
 next();
}

 draftnew:id=>{const a=S.apps.find(x=>x.id===id);const f=a.newF.find(x=>!x.drafted);if(!f)return;f.drafted=true;const nid=String(a.full?16:5).padStart(3,'0');const nm=f.obj.replace('Measure ','');a.changes.push({id:nid,title:'Description for '+nm,lvl:1,find:[],obj:f.obj,reload:false,by:'AI',before:'(no description)',after:nm==='Units Sold'?'Total units sold on the order lines in the current selection (Sum of Quantity).':'Total units sold in the current selection.',reason:'A developer added this measure without a description, so AI tools have to guess what it counts.',checks:[['Description reads back as approved','Expected','none','new text'],[a.full?'Total Sales, all regions':'Key numbers (12)','Same',a.full?'1,731,922.09':'baseline',a.full?'1,731,922.09':'baseline']],st:'submitted',sub:SUBMITTER,apr:null,undo:'U-'+nid,trace:'lf-'+nid+'c9'});a.newF=a.newF.filter(x=>x!==f);toast('Drafted #'+nid+'. It\'s waiting in the review queue.');},
 runchecks:()=>{const a=app();const f=a&&a.full?QA.filter(q=>!qaPass(a,q)).length:0;toast('Ran 3 answer checks: '+(3-f)+' passing'+(f?', '+f+' failing':'')+'. Results are stored in the evidence pack.');},
 dl:t=>toast(t==='addq'?'Add a question and its expected answer here in the product.':t==='restorev'?'Restoring an older version creates a change that needs approval, like any other.':t==='connect'?'Connection setup opens here in the product.':t==='space'?'Space picker opens here in the product.':'The '+t+' download starts here in the product. This prototype can\'t save files.'),
 role:r=>{S.role=r;S.rejecting=null;S.edit=null;render(true);},
 scen:s=>{if(S.apps.some(a=>a.ran||a.running)){toast('Reset the demo to change the scenario after Apply has run.');return;}S.scenario=s;render(true);},
 reset:()=>{const r=S.role,dm=S.demoMin;S=init();S.role=r;S.demoMin=dm;render();toast('Demo reset.');},
 bell:()=>{S.bell=!S.bell;render(true);},
 bellgo:id=>{S.bell=false;if(id==='queue')return nav('queue');A.open(id);},
 predict:()=>toast('KAIRO Predict opens here. It\'s in the separate prediction prototype.'),
 asst:()=>{S.asst=!S.asst;render(true);},
 ask:i=>A.asksug(SUG[+i]),
 asksug:t=>{S.msgs.push({u:1,t});S.msgs.push(answer(t));render(true);},
 send:()=>{const t=(S.chatIn||'').trim();if(!t)return;S.chatIn='';A.asksug(t);setTimeout(()=>{const i=document.getElementById('chatin');i&&i.focus();},0);},
 asstclear:()=>{S.msgs=[];render(true);},
 sort:k=>{S.sort=k;render(true);},
 npickall:()=>{const n=S.nw;const taken=S.apps.map(a=>a.name);const names=(n.site==='cloud'?['POC C - Sales Dashboard','Sales Dashboard','Demo Sales Analytics']:['Regional Sales','Claims Overview']).filter(x=>!taken.includes(x));const all=names.every(x=>n.pick[x]);names.forEach(x=>n.pick[x]=!all);render(true);},
 dis:id=>{S.dismissing=id;S.disText='';render(true);setTimeout(()=>{const t=document.getElementById('distx');t&&t.focus();},0);},
 discancel:()=>{S.dismissing=null;render(true);},
 disok:id=>{const a=app();const r=(S.disText||'').trim()||'No reason given';a.dism[id]=r;S.dismissing=null;a.changes.forEach(c=>{if(c.find.length&&c.find.every(f=>a.dism[f])&&c.st==='drafted')c.st='dismissed';});toast(id+' dismissed. Its fix won\'t be proposed, and it stays dismissed on future scans.');},
 undis:id=>{const a=app();delete a.dism[id];a.changes.forEach(c=>{if(c.st==='dismissed'&&!c.find.every(f=>a.dism[f]))c.st='drafted';});toast(id+' restored.');},
 rewrite:k=>{const c=app().changes.find(x=>x.id===S.edit);const V={'010':{short:'Sales, cost and gross margin % by region, segment, product and month, Jan 2025 to Sep 2026. Owner: Sales Operations.',fin:'Revenue (Total Sales) and gross margin % ((revenue − cost of sales) ÷ revenue) by region, customer segment, product and month, January 2025 to September 2026. Use it for revenue, gross margin and profitability questions. Owner: Sales Operations.',hi:'क्षेत्र, ग्राहक सेगमेंट, उत्पाद और महीने के अनुसार बिक्री, जनवरी 2025 से सितंबर 2026। माप: कुल बिक्री और सकल मार्जिन %। मालिक: सेल्स ऑपरेशंस।'},'012':{short:'(Sales − Cost) ÷ Sales, shown as a percent. Not the Margin amount field.',fin:'Gross margin %: (revenue − cost of sales) ÷ revenue for the current selection, shown as a percent. Not the Margin field, which is the margin amount in currency.',hi:'सकल मार्जिन %: (बिक्री − लागत) ÷ बिक्री, प्रतिशत में। Margin फ़ील्ड से अलग, जो राशि है।'}};const v=(V[c&&c.id]||{short:'Units sold (sum of Quantity).',fin:'Units sold: sum of Quantity on the order lines in the selection.',hi:'बेची गई इकाइयाँ (Quantity का योग)।'})[k];S.editText=v;render(true);toast('AI rewrote the draft in house style v2. Review it, then save or cancel.');},
 restore:id=>{const a=S.apps.find(x=>x.id===id);if(a.changes.some(c=>c.restores&&['submitted','live'].includes(c.st)))return;a.changes.push({id:'017',title:'Restore the percent format on Gross Margin %',lvl:2,find:[],obj:'Measure Gross Margin %',reload:false,by:'Template N1',before:'0.40',after:'40.4%',reason:'An unapproved edit in the Qlik editor removed the approved format (#013).',checks:[['Gross Margin % · South (value)','Same','0.4038','0.4038'],['Gross Margin % · South (shown)','Expected','0.40','40.4%']],st:'submitted',sub:SUBMITTER,apr:null,undo:'U-017',trace:'lf-017d2',restores:true});a.newF=a.newF.filter(f=>f.kind!=='drift');toast('Restore #017 drafted from the approved version and sent for approval.');},
 dismissf:arg=>{const [ai,fid]=arg.split('|');const a=S.apps.find(x=>x.id===ai);const f=a.newF.find(x=>x.id===fid);a.newF=a.newF.filter(x=>x.id!==fid);if(f&&f.kind==='drift'){a.drift=false;toast('Edit accepted and recorded in the evidence pack.');}else toast('Finding dismissed. It stays dismissed on future scans.');},
 jira:arg=>{const n='SALES-'+(140+Object.keys(S.jira).length+2);S.jira[arg.replace('|','')]=n;toast('Created '+n+' in Jira for the developer.');},
 qd:arg=>{const [i,v]=arg.split('|');S.qd=S.qd||{};S.qd[i]=v;render(true);},
 qdsend:()=>{const a=S.apps.find(x=>x.id==='sls');a.newF=a.newF.filter(f=>f.kind!=='qlikdesc');a.changes.push({id:'006',title:'Use approved definitions for AMT, CST, RGN, MTH',lvl:1,find:[],obj:'4 fields',reload:true,by:'AI',before:'Descriptions written by Qlik Answers',after:'Approved definitions from #002 (your choices kept)',reason:'Qlik Answers generated descriptions that nobody approved; two differ from the approved meaning.',checks:[['Descriptions read back as chosen','Expected','Qlik text','approved text'],['Key numbers (12)','Same','baseline','baseline']],st:'submitted',sub:SUBMITTER,apr:null,undo:'U-006',trace:'lf-006b1'});S.modal=null;toast('Sent for approval as #006. It\'s in the review queue.');},
 modal:m=>{S.modal=m;S.bell=false;render(true);},
 verify:()=>toast('Chain verified: every entry matches the hash of the one before. No gaps or edits.'),
 invite:()=>{S.inviting=true;S.invEmail='';render(true);setTimeout(()=>{const t=document.getElementById('invtx');t&&t.focus();},0);},
 invcancel:()=>{S.inviting=false;render(true);},
 invok:()=>{const e=(S.invEmail||'').trim();if(!e.includes('@')){toast('Enter an email address.');return;}S.invites.push(e);S.inviting=false;toast('Invite sent to '+e+'. Read-only access to evidence, ends in 30 days.');},
 stylehi:()=>{S.style.hi=!S.style.hi;render(true);},
 new:()=>{S.modal='new';S.nw={site:'cloud',pick:{},approver:APPROVER};render(true);},
 closemodal:()=>{S.modal=null;render(true);},
 closeov:(arg,el,e)=>{if(e.target===el){S.modal=null;render(true);}},
 nsite:k=>{S.nw.site=k;S.nw.pick={};render(true);},
 npick:n=>{S.nw.pick[n]=!S.nw.pick[n];render(true);},
 addapps:()=>{const names=Object.keys(S.nw.pick).filter(k=>S.nw.pick[k]);const site=S.nw.site;let first=null;
  names.forEach((nm,i)=>{const a=fullApp({id:'n'+Date.now()+i,name:nm,site,usage:nm.startsWith('POC C')?410:nm.startsWith('Regional')?2150:35});S.apps.unshift(a);if(!first)first=a;});
  S.nw.first=first.name;S.nw.firstId=first.id;S.nw.chkI=0;S.modal='check';render(true);
  const t=()=>{if(S.modal!=='check')return;S.nw.chkI++;render(true);if(S.nw.chkI<5)setTimeout(t,360);};setTimeout(t,360);},
 openadded:()=>{S.modal=null;S.filter='all';A.open(S.nw.firstId);},
 pol:k=>{S.pol[k]=!S.pol[k];render(true);},
 rule:k=>{S.rules[k]=!S.rules[k];render(true);},
 settab:t=>{S.setTab=t;render(true);},
 demomin:()=>{S.demoMin=!S.demoMin;render(true);}
};
/* ---------- v2 actions ---------- */
Object.assign(A,{
 asapprover:()=>{S.role='approver';S.edit=null;S.rejecting=null;toast('Signed in as '+APPROVER+' · Approver');},
 addqlib:()=>{S.askTab='lib';nav('ask');toast('Add the question to the question library. It runs after every reload.');},
 asktab:t=>{S.askTab=t;render(true);},
 asksite:s=>{S.askSite=s;toast(s==='onprem'?'KAIRO now runs on-prem with a local model: no data leaves the network and AI cost is $0.':'KAIRO runs on Qlik Cloud with Claude through the KAIRO gateway.');},
 askq:i=>askRun(EN.QUESTIONS[+i].q),
 askq2:q=>askRun(q),
 askgo:()=>askRun(S.askIn),
 askfull:q=>askRun(q),
 askclear:()=>{if(S.live)return;S.chat=[];S.fb={};S.howOpen={};render(true);},
 howtg:i=>{S.howOpen[i]=!S.howOpen[i];render(true);},
 fb:arg=>{const [i,v]=arg.split('|');S.fb[i]=v;if(v==='down'){S.feedback.unshift({q:S.chat[+i],who:me().name,when:'Today '+hhmm()});toast('Marked not helpful. A finding was created for the data team (Business context → User feedback).');}else toast('Marked helpful. Thanks.');},
 savelib:i=>{const q=S.chat[+i];if(!q||libHas(q))return;S.lib.push({q,asked:0,last:'not run yet',custom:true,by:me().name});toast('Saved as an answer check. It runs with the others after every reload.');},
 libadd:()=>{const q=(S.libIn||'').trim();if(!q){toast('Type a question first.');return;}if(libHas(q)){toast('That question is already saved.');return;}S.lib.push({q,asked:0,last:'not run yet',custom:true,by:me().name});S.libIn='';
  if(EN.answer(q).desk.fallback){S.feedback.unshift({q,who:me().name,when:'Today '+hhmm(),why:'KAIRO can\'t answer this yet: no approved column, rule or link matches it'});toast('Saved. KAIRO can\'t answer it yet, so a finding was created for the data team.');}else toast('Saved. It runs with the other checks after every reload.');},
 librun:()=>{if(S.libRun)return;const qs=S.lib.slice().sort((x,y)=>y.asked-x.asked).map(x=>x.q);let k=0;S.libRun={cur:qs[0]};render(true);
  const t=()=>{if(!S.libRun)return;k++;if(k>=qs.length){const L=S.lib.map(x=>EN.answer(x.q)),ok=L.filter(a=>!a.desk.fallback).length,so=L.filter(a=>a.std.verdict.kind==='ok').length;S.lib.forEach(x=>x.last='Today '+hhmm());S.libHist.push({d:'Today',std:so,k:ok,n:L.length});S.libRun=null;toast('Ran '+qs.length+' answer checks: KAIRO '+ok+' correct, standard assistant '+so+'. Results saved in the evidence pack.');return;}S.libRun={cur:qs[k]};render(true);setTimeout(t,380);};setTimeout(t,380);},
 ctxtab:t=>{S.ctxTab=t;render(true);},
 ctxtbl:t=>{S.ctxTable=t;render(true);},
 ctxfilter:f=>{S.ctxFilter=f;render(true);},
 ctxrows:()=>{S.ctxRows=!S.ctxRows;render(true);},
 ctxgo:id=>{const it=CTX[id];S.q='';S.asst=false;S.ctxTab=it.kind==='Column'?'cols':it.kind==='Business rule'?'rules':'rels';if(it.ds)S.ctxTable=it.ds;S.ctxFilter='all';nav('ctx');},
 ctxok:id=>{if(!can.approve()){toast('Only '+APPROVER+' can approve.');return;}S.ctx.st[id]='approved';S.ctx.dec[id]={by:me().name,at:'Today '+hhmm()};toast(me().name+' approved it. KAIRO now uses “'+CTX[id].name+'”.');},
 ctxall:()=>{if(!can.approve())return;const p=ctxPending();p.forEach(id=>{S.ctx.st[id]='approved';S.ctx.dec[id]={by:me().name,at:'Today '+hhmm()};});toast(me().name+' approved '+p.length+' item'+(p.length>1?'s':'')+'. KAIRO answers that use them are now certified.');},
 ctxedit:id=>{if(!can.apply())return;S.ctxEditId=id;S.ctxEditText=cdesc(id);S.modal='ctxedit';render(true);setTimeout(()=>{const t=document.getElementById('cetx');t&&t.focus();},0);},
 ctxsave:()=>{const id=S.ctxEditId,t=(S.ctxEditText||'').trim();S.modal=null;if(!t||t===cdesc(id)){toast('No changes to save.');return;}S.ctx.ed[id]=t;toast('Saved. Your wording replaces the AI draft'+(cst(id)==='pending'?' and still needs approval.':'.'));},
 ctxrej:id=>{if(!can.approve())return;S.ctxRejId=id;S.ctxRejText='';S.modal='ctxrej';render(true);setTimeout(()=>{const t=document.getElementById('crtx');t&&t.focus();},0);},
 ctxrejok:()=>{const id=S.ctxRejId,t=(S.ctxRejText||'').trim();if(!t)return;S.ctx.st[id]='rejected';S.ctx.dec[id]={by:me().name,at:'Today '+hhmm(),why:t};S.modal=null;toast('Rejected. KAIRO won\'t use “'+CTX[id].name+'”.');},
 ctxreopen:id=>{S.ctx.st[id]='pending';delete S.ctx.dec[id];toast('Back in review.');},
 ctxanalyse:()=>{if(S.ctxRun||!can.apply())return;S.ctxRun={i:0};render(true);const n=ctxSteps().length;const t=()=>{if(!S.ctxRun)return;S.ctxRun.i++;if(S.ctxRun.i>=n){S.ctxRun=null;toast('AI analysis finished: 26 column meanings, 7 rules and 3 relationships. '+ctxPending().length+' need review.');return;}render(true);setTimeout(t,480);};setTimeout(t,480);},
 fbdismiss:i=>{S.feedback.splice(+i,1);toast('Feedback dismissed.');},
 sgofield:f=>{S.q='';A.open('demo');toast('Field '+f+': its description is part of change #011 in Demo Sales Analytics.');},
 sgochange:arg=>{const [ai,id]=arg.split('|');S.q='';A.open(ai);const a=app();if(a&&a.full&&a.stage<LIVE){S.stageView=Math.min(a.stage,2);S.sel=id;}else S.tab='changes';render();},
 mcp:()=>{const a=app();if(!a)return;a.mcp=true;toast('MCP endpoint on. Claude, ChatGPT and Copilot now read the approved definitions through KAIRO.');}
});
document.addEventListener('click',e=>{
 if(S.q&&!e.target.closest('.search')){S.q='';const r=document.getElementById('sres');if(r)r.innerHTML='';const qi=document.getElementById('q');if(qi)qi.value='';}
 const el=e.target.closest('[data-act]');
 if(!el){if(S.bell&&!e.target.closest('.bellpop')){S.bell=false;render(true);}return;}
 if(el.tagName==='INPUT'&&el.type==='checkbox'){e.preventDefault();}
 const act=el.dataset.act;
 if(act==='closeov'&&e.target!==el)return;
 const f=A[act]; if(f) f(el.dataset.arg,el,e);
 if(['submit','approve','approvewording','rejok','saveedit','undook','simreload','draftnew'].includes(act)) render(true);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.matches('tr.click')){A.open(e.target.dataset.arg);}
 if(e.key==='Enter'&&e.target.id==='chatin'){e.preventDefault();A.send();}
 if(e.key==='Enter'&&e.target.id==='distx'){e.preventDefault();A.disok(S.dismissing);}
 if(e.key==='Enter'&&e.target.id==='invtx'){e.preventDefault();A.invok();}
 if(e.key==='Enter'&&e.target.id==='askin'){e.preventDefault();A.askgo();}
 if(e.key==='Enter'&&e.target.id==='libin'){e.preventDefault();A.libadd();}
 if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();const f=document.querySelector('#sres button');if(f)f.click();}
 if(e.key==='Escape'&&S.q){S.q='';render(true);return;}
 if(e.key==='Escape'){if(S.modal){S.modal=null;render(true);}else if(S.asst){S.asst=false;render(true);}else if(S.bell){S.bell=false;render(true);}}
});
document.addEventListener('input',e=>{
 const b=e.target.dataset.bind; if(!b)return;
 if(b==='after'){S.editText=e.target.value;}
 if(b==='chat'){S.chatIn=e.target.value;}
 if(b==='dis'){S.disText=e.target.value;}
 if(b==='inv'){S.invEmail=e.target.value;}
 if(b==='search'){S.q=e.target.value;const r=document.getElementById('sres');if(r)r.innerHTML=searchRes();}
 if(b==='ask'){S.askIn=e.target.value;}
 if(b==='libin'){S.libIn=e.target.value;}
 if(b==='ctxedit'){S.ctxEditText=e.target.value;}
 if(b==='ctxrej'){S.ctxRejText=e.target.value;const btn=document.querySelector('[data-act="ctxrejok"]');if(btn){if(S.ctxRejText.trim())btn.removeAttribute('disabled');else btn.setAttribute('disabled','');}}
 if(b==='rej'){S.rejText=e.target.value; const btn=document.querySelector('[data-act="rejok"]'); if(btn){if(S.rejText.trim())btn.removeAttribute('disabled');else btn.setAttribute('disabled','');}}
});
document.addEventListener('change',e=>{
 const b=e.target.dataset.bind; if(b==='undo'){S.pol.undo=e.target.value;} if(b==='schedule'){S.pol.schedule=e.target.value;} if(b==='remind'){S.pol.remind=e.target.value;render(true);} if(b==='tone'){S.style.tone=e.target.value;} if(b==='len'){S.style.len=e.target.value;} if(b==='approver'){S.nw.approver=e.target.value;} if(b==='role'){S.role=e.target.value;S.rejecting=null;S.edit=null;toast('Signed in as '+me().name+' · '+me().role);}
});
render();
</script>
